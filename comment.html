<main class="content">
    <p class="eyebrow">Tinggalkan Jejak ☁️</p>
    <p class="lead">Tuliskan kesan, pesan, atau apa saja di sini!</p>

    <div class="comment-section">
        <form action="#" method="GET" class="comment-form" onsubmit="event.preventDefault(); alert('Fitur interaktif murni CSS/HTML: Komentar Anda tersimpan secara lokal di halaman ini!');">
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Nama kamu..." required>
            </div>
            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" rows="3" placeholder="Tulis komentar atau pesan..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Kirim Komentar</button>
        </form>

        <div class="comments-container">
            <h3>Komentar Masuk</h3>
            
            <div class="cloud-bubble">
                <p class="comment-author"></p>
                <p class="comment-text"></p>
            </div>

            <div class="cloud-bubble">
                <p class="comment-author"></p>
                <p class="comment-text"></p>
            </div>
        </div>
    </div>
