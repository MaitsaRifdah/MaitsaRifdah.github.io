<main class="content">
    <p class="eyebrow">Tinggalkan Jejak ☁️</p>
    <p class="lead">Tuliskan kesan, pesan, atau apa saja di sini!</p>

    <div class="comment-section">
        <form action="#" method="GET" class="comment-form" onsubmit="event.preventDefault(); alert('Fitur interaktif murni CSS/HTML: Komentar Anda tersimpan secara lokal di halaman ini!');">
            <div class="form-group">
                <label for="nama">Nama</label>

            </div>
            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" rows="3" placeholder="Tulis komentar atau pesan..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Kirim Komentar</button>
        </form>

  <br><br>

        </div>
    </div>
</main>
            <footer>© 2026 MRF</footer>
        </div>
<script>
    const toggleButton = document.getElementById('theme-toggle');
    const rootElement = document.documentElement;
    const currentTheme = localStorage.getItem('theme');
    
    if (currentTheme === 'light') {
        rootElement.setAttribute('data-theme', 'light');
        toggleButton.textContent = '☀️'; 
    }
    toggleButton.addEventListener('click', () => {
        let theme = rootElement.getAttribute('data-theme');
        
        if (theme === 'light') {
            rootElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'dark');
            toggleButton.textContent = '🌙';
        } else {
            rootElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleButton.textContent = '☀️';
        }
    });
</script>
    </body>
